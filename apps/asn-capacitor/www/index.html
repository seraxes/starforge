<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Airsoft Nexus</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;

      }

  <body>
    <h1>Airsoft Nexus</h1>
    <p>
      Capacitor shell placeholder. Set <code>server.url</code> in
      <code>capacitor.config.ts</code> (or <code>CAPACITOR_SERVER_URL</code>) to

    </p>

      <code>StarforgeLiveMap.onSession({ active: true })</code> after Join.
    </p>
