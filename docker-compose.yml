services:
  postgres:
    image: postgres:16-alpine
    container_name: starforge-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: starforge
      POSTGRES_PASSWORD: starforge
      POSTGRES_DB: starforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starforge -d starforge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
