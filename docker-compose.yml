services:
  postgres:
    image: postgres:16-alpine
    container_name: starforge-postgres
    restart: unless-stopped
    # Bind localhost only — DB must never be reachable on the LAN/public interface.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: starforge
      POSTGRES_PASSWORD: starforge
      POSTGRES_DB: starforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starforge -d starforge']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: docker compose --profile redis up -d
  redis:
    profiles: ['redis']
    image: redis:7-alpine
    container_name: starforge-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
