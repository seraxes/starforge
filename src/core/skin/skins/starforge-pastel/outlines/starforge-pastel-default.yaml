id: starforge-pastel-default
label: Pastel — Base
defaultForSite: true
document:
  version: 3
  sections:
    - id: header
      label: Header
      order: 0
      rows:
        - id: header-row-1
          order: 0
          slots:
            - id: header-notice
              moduleId: notice-bar
              width: 100
              enabled: true
              order: 0
        - id: header__trailing-empty
          order: 1
          slots: []
    - id: navigation
      label: Navigation
      order: 1
      rows:
        - id: navigation-row-1
          order: 0
          slots:
            - id: navigation-site-header
              moduleId: site-header
              width: 100
              enabled: true
              order: 0
        - id: navigation__trailing-empty
          order: 1
          slots: []
    - id: main
      label: Main
      order: 2
      rows:
        - id: main-row-1
          order: 0
          slots:
            - id: main-page-content
              moduleId: page-content
              width: 100
              enabled: true
              order: 0
        - id: main__trailing-empty
          order: 1
          slots: []
    - id: footer
      label: Footer
      order: 3
      rows: []
